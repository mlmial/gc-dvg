name: gc_dvg
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - r-base=4.5
  - r-readr=2.2.0
  - r-forecast=9.0.2
  - r-dplyr=1.2.1
  - r-tidyr=1.3.2
  - r-ggplot2=4.0.3
  # core stack
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.0.3
  - scikit-learn=1.6.1
  - statsmodels=0.14.4
  - scikit-posthocs=0.11.4
  - tslearn
  - biopython=1.85
  # plotting
  - matplotlib-base=3.8.3
  - seaborn=0.13.2
  - plotly
  - mscorefonts
  # I/O
  - openpyxl=3.1.5
  # notebook
  - ipython=8.18.1
  - ipykernel=6.29.3
  - notebook=7.3.2
  - nbformat=5.10.4